name: AC Plugin Test
on:
  push:
    branches:
      - feature/pl-311-marketplacetest
jobs:
  td:
    runs-on: ubuntu-latest
    steps:
      - run: echo "TD Test Job v4"
      - run: curl -fSL -o app.apk "https://storage.googleapis.com/appcircle-dev-common/self-hosted/sample-apps/appcircle-sample-flutter.apk"
      - uses: appcircleio/appcircle-testing-distribution-githubaction@v0.1.1-beta.1
        with:
          personalAPIToken: ${{ secrets.AC_MARKETPLACE_PERSONNEL_ACCESS_KEY }}
          profileName: Marketplace-Github-Action-Test
          appPath: app.apk
          createProfileIfNotExists: true
  eas:
    runs-on: ubuntu-latest
    steps:
      - run: echo "EAS Test Job v4"
      - run: curl -fSL -o app.apk "https://storage.googleapis.com/appcircle-dev-common/self-hosted/sample-apps/appcircle-sample-flutter.apk"
      - uses: appcircleio/appcircle-enterprise-app-store-githubaction@v0.1.1-beta.1
        with:
          personalAPIToken: ${{ secrets.AC_MARKETPLACE_PERSONNEL_ACCESS_KEY }}
          appPath: app.apk
